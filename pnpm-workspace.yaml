# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
# Exact security release published by Next.js on 2026-09-30.
minimumReleaseAgeExclude:
  - next@15.5.27
  - eslint-config-next@15.5.27
  - '@next/env@15.5.27'
  - '@next/eslint-plugin-next@15.5.27'
  - '@next/swc-darwin-arm64@15.5.27'
  - '@next/swc-darwin-x64@15.5.27'
  - '@next/swc-linux-arm64-gnu@15.5.27'
  - '@next/swc-linux-arm64-musl@15.5.27'
  - '@next/swc-linux-x64-gnu@15.5.27'
  - '@next/swc-linux-x64-musl@15.5.27'
  - '@next/swc-win32-arm64-msvc@15.5.27'
  - '@next/swc-win32-x64-msvc@15.5.27'
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
# styled-jsx declares Babel as an optional peer; explicitly resolve a patched version.
packageExtensions:
  styled-jsx@5.1.6:
    dependencies:
      '@babel/core': 7.29.6

overrides:
  miniflare>sharp: 0.35.4
  postcss@<8.5.23: 8.5.23
  '@babel/core': 7.29.6
  browserslist@<4.28.7: 4.28.7
  baseline-browser-mapping@<2.11.0: 2.11.0
  fast-uri@<3.1.8: 3.1.8
